name: Release

# Run from the Actions tab: pick patch, minor or major. The workflow bumps the version in
# app/build.gradle.kts, builds the signed APK and AAB, and only if that succeeds commits the
# bump to main, tags it and publishes a GitHub release with both files attached.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# One release at a time, never cancelled half way through.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Check signing secrets
        env:
          KS: ${{ secrets.HALO_KEYSTORE_BASE64 }}
          SP: ${{ secrets.HALO_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.HALO_KEY_ALIAS }}
          KP: ${{ secrets.HALO_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing HALO_KEYSTORE_BASE64"
          [ -n "$SP" ] || missing="$missing HALO_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing HALO_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing HALO_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Bump version in app/build.gradle.kts
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          FILE=app/build.gradle.kts
          NAME=$(grep -oP 'versionName = "\K[0-9]+\.[0-9]+\.[0-9]+(?=")' "$FILE")
          CODE=$(grep -oP 'versionCode = \K[0-9]+' "$FILE")
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::Couldn't read versionName/versionCode from $FILE"
            exit 1
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$NAME"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_NAME="$MAJOR.$MINOR.$PATCH"
          NEW_CODE=$((CODE + 1))
          if git rev-parse -q --verify "refs/tags/v$NEW_NAME" >/dev/null; then
            echo "::error::Tag v$NEW_NAME already exists"
            exit 1
          fi
          sed -i -E "s/versionName = \"$NAME\"/versionName = \"$NEW_NAME\"/; s/versionCode = $CODE\b/versionCode = $NEW_CODE/" "$FILE"
          grep -q "versionName = \"$NEW_NAME\"" "$FILE" && grep -q "versionCode = $NEW_CODE" "$FILE"
          echo "Bumping $NAME ($CODE) -> $NEW_NAME ($NEW_CODE)"
          echo "name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEW_NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Restore keystore
        env:
          KS: ${{ secrets.HALO_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 --decode > "$RUNNER_TEMP/halo-release.jks"

      # Nothing is pushed until this step succeeds.
      - name: Build signed APK and AAB
        env:
          HALO_KEYSTORE_PATH: ${{ runner.temp }}/halo-release.jks
          HALO_KEYSTORE_PASSWORD: ${{ secrets.HALO_KEYSTORE_PASSWORD }}
          HALO_KEY_ALIAS: ${{ secrets.HALO_KEY_ALIAS }}
          HALO_KEY_PASSWORD: ${{ secrets.HALO_KEY_PASSWORD }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ./gradlew --no-configuration-cache assembleRelease bundleRelease
          cp app/build/outputs/apk/release/app-release.apk "halo-$TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "halo-$TAG.aab"

      # Verifies the signature and records the certificate fingerprint for the release notes.
      - name: Show signing certificate
        id: cert
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs "halo-$TAG.apk")
          echo "$OUT" | grep -E "SHA-256|DN"
          DIGEST=$(echo "$OUT" | grep -m1 -oP 'certificate SHA-256 digest: \K[0-9a-f]{64}')
          # AA:BB:CC… uppercase, the format AppVerifier and most docs use.
          FP=$(echo "$DIGEST" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/halo-release.jks"

      - name: Commit, tag and push
        env:
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "Release $TAG (versionCode $CODE)"
          git tag -a "$TAG" -m "Halo $TAG"
          # One atomic push: main and the tag update together or not at all, so a failure
          # can never leave a version bump on main without its tag and release.
          # Fails (and publishes nothing) if main moved while this was building; just run it again.
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      # GitHub's --generate-notes only lists merged pull requests, and Halo is committed to
      # main directly, so build the notes from commits instead: everything since the last
      # release that changed the app itself (README, docs and CI changes are left out).
      - name: Write release notes
        env:
          TAG: ${{ steps.version.outputs.tag }}
          FP: ${{ steps.cert.outputs.fingerprint }}
          REPO: ${{ github.repository }}
        run: |
          PREV=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          RANGE=${PREV:+$PREV..}$TAG
          CHANGES=$(git log "$RANGE" --no-merges --reverse --format='- %s' -- app/ | grep -v '^- Release v' || true)
          {
            echo "## What's new"
            echo
            if [ -n "$CHANGES" ]; then echo "$CHANGES"; else echo "- Small fixes and improvements."; fi
            echo
            [ -n "$PREV" ] && echo "**All changes**: https://github.com/$REPO/compare/$PREV...$TAG" && echo
            echo "## Install"
            echo
            echo "- [Google Play](https://play.google.com/store/apps/details?id=com.yogeshpaliyal.halo)"
            echo "- [Obtainium](https://yogeshpaliyal.github.io/Halo/obtainium/), for automatic APK updates"
            echo "- \`halo-$TAG.apk\` below"
            echo
            echo "## Verify your download"
            echo
            echo "Signing certificate SHA-256 (the same for every Halo release and the Play Store version):"
            echo
            echo '```'
            echo "com.yogeshpaliyal.halo"
            echo "$FP"
            echo '```'
            echo
            echo "Paste both lines into [AppVerifier](https://github.com/soupslurpr/AppVerifier), or compare with \`apksigner verify --print-certs\`."
            echo
            echo "File checksums (SHA-256):"
            echo
            echo '```'
            sha256sum "halo-$TAG.apk" "halo-$TAG.aab"
            echo '```'
          } > notes.md
          cat notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "halo-$TAG.apk" "halo-$TAG.aab" \
            --title "Halo $TAG" \
            --notes-file notes.md \
            --verify-tag
